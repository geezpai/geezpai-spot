# Blinky — Geezpai Spot SDK: GPIO LED 闪烁
#
# 使用 nRF52840 DK 的 led0 (P1.10, 低电平点亮)。
# Geezpai Spot 板需外接 LED 到 J6 扩展排针，并修改 src/main.c 中的引脚定义。

# --- Console and logging ---
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# --- GPIO for LED control ---
CONFIG_GPIO=y

# --- Minimal build: disable wireless and unused peripherals ---
CONFIG_BT=n
CONFIG_PWM=n
CONFIG_SPI=n
CONFIG_I2C=n

# Reboot on fatal error
CONFIG_RESET_ON_FATAL_ERROR=y
