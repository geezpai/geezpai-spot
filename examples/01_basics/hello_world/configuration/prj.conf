# Hello World — Geezpai Spot SDK 最简示例
#
# 仅需串口输出，用于验证工具链和基本系统启动。

# --- Console and logging ---
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# --- Minimal build: disable all wireless and peripherals ---
CONFIG_BT=n
CONFIG_GPIO=n
CONFIG_PWM=n
CONFIG_I2C=n
CONFIG_SPI=n

# Reboot instead of hanging on fatal error
CONFIG_RESET_ON_FATAL_ERROR=y
